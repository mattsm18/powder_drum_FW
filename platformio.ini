; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nano_every]
platform = atmelmegaavr
board = nano_every
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<as5600_angle_test.cpp>

; Regenerate include/protocol_generated.h from
; config/pd_comms_protocol_v1.0.json before every build.
extra_scripts = pre:scripts/pio_generate_protocol.py

build_flags =
    -I include

platform_packages =
    platformio/framework-arduino-avr@^5.4.0

lib_deps = 
    AsyncTWI
    AS5600
    StepperMotor
    PIDController
    PowderDrumProtocol
    SignalProcessing
    
; Test just the angle read
;[env:as5600_angle_test] 
;extends = env:nano_every
;build_src_filter = -<*> +<as5600_angle_test.cpp>
